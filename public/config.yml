backend:
  name: github
  repo: dilshanprasanna/Portfolio
  branch: main
  squash_merges: true

local_backend: true

site_url: https://dilshanprasanna.github.io/Portfolio/
logo_url: /brand/logo.svg
media_folder: "public/images"
public_folder: "/images"
publish_mode: editorial_workflow
locale: en
show_preview_links: true

media_library:
  name: uploadcare
  config:
    multiple: true

collections:
  - name: "portfolio_data"
    label: "Portfolio Data"
    files:
      - name: "data"
        label: "Site Data (data.json)"
        file: "data.json"
        format: "json"
        editor:
          preview: true
        fields:
          - { name: "siteSettings", label: "Site Settings", widget: "object" }
          - { name: "navigation", label: "Navigation", widget: "object" }
          - { name: "hero", label: "Hero", widget: "object" }
          - { name: "about", label: "About", widget: "object" }
          - { name: "skills", label: "Skills", widget: "object" }
          - { name: "experience", label: "Experience", widget: "object" }
          - { name: "education", label: "Education", widget: "object" }
          - { name: "projects", label: "Projects", widget: "object" }
          - { name: "testimonials", label: "Testimonials", widget: "object" }
          - { name: "contact", label: "Contact", widget: "object" }
          - { name: "footer", label: "Footer", widget: "object" }
