backend:
  name: github
  repo: dilshanprasanna/Portfolio
  branch: main

local_backend: true

media_folder: "public/images"
public_folder: "/images"

media_library:
  name: uploadcare

site_url: https://dilshanprasanna.github.io/Portfolio/
logo_url: /brand/logo.svg
publish_mode: editorial_workflow
locale: en
show_preview_links: true

collections:
  - name: "portfolio_data"
    label: "Portfolio Data"
    files:
      - name: "data"
        label: "Portfolio Content"
        file: "data.json"
        format: "json"
        editor:
          preview: true
        fields:
          - name: "siteSettings"
            label: "Site Settings"
            widget: "object"
            fields:
              - name: "personalInfo"
                label: "Personal Info"
                widget: "object"
                fields:
                  - { name: "fullName", label: "Full Name", widget: "string" }
                  - { name: "professionalTitle", label: "Professional Title", widget: "string" }
                  - { name: "profilePicture", label: "Profile Picture", widget: "image", required: false }
                  - { name: "coverImage", label: "Cover Image", widget: "image", required: false }
                  - { name: "shortBio", label: "Short Bio", widget: "text" }
                  - { name: "detailedBiography", label: "Detailed Biography", widget: "markdown" }
                  - { name: "location", label: "Location", widget: "string" }
                  - { name: "timezone", label: "Timezone", widget: "string" }
                  - { name: "currentStatus", label: "Current Status", widget: "string" }
                  - { name: "availabilityStatus", label: "Availability Status", widget: "string" }
                  - { name: "freelanceAvailability", label: "Freelance Availability", widget: "boolean" }
              - name: "seo"
                label: "SEO"
                widget: "object"
                fields:
                  - { name: "websiteTitle", label: "Website Title", widget: "string" }
                  - { name: "metaDescription", label: "Meta Description", widget: "text" }
                  - { name: "keywords", label: "Keywords", widget: "list", field: { name: "keyword", label: "Keyword", widget: "string" } }
                  - { name: "openGraphImage", label: "Open Graph Image", widget: "image", required: false }
                  - { name: "twitterCardImage", label: "Twitter Card Image", widget: "image", required: false }
                  - { name: "googleAnalyticsId", label: "Google Analytics ID", widget: "string", required: false }
              - name: "theme"
                label: "Theme"
                widget: "object"
                fields:
                  - { name: "primaryColor", label: "Primary Color", widget: "string" }
                  - { name: "secondaryColor", label: "Secondary Color", widget: "string" }
                  - { name: "accentColor", label: "Accent Color", widget: "string" }
                  - { name: "fontFamily", label: "Font Family", widget: "string" }
                  - { name: "borderRadius", label: "Border Radius", widget: "string" }
                  - { name: "animationSpeed", label: "Animation Speed", widget: "string" }
                  - name: "darkModeColors"
                    label: "Dark Mode Colors"
                    widget: "object"
                    fields:
                      - { name: "background", label: "Background", widget: "string" }
                      - { name: "surface", label: "Surface", widget: "string" }
                      - { name: "text", label: "Text", widget: "string" }
                      - { name: "muted", label: "Muted", widget: "string" }
                  - name: "lightModeColors"
                    label: "Light Mode Colors"
                    widget: "object"
                    fields:
                      - { name: "background", label: "Background", widget: "string" }
                      - { name: "surface", label: "Surface", widget: "string" }
                      - { name: "text", label: "Text", widget: "string" }
                      - { name: "muted", label: "Muted", widget: "string" }
              - name: "branding"
                label: "Branding"
                widget: "object"
                fields:
                  - { name: "logo", label: "Logo", widget: "image", required: false }
                  - { name: "favicon", label: "Favicon", widget: "image", required: false }
                  - { name: "footerCopyrightText", label: "Footer Copyright Text", widget: "string" }
              - name: "footer"
                label: "Footer"
                widget: "object"
                fields:
                  - { name: "currentStatus", label: "Current Status", widget: "string" }
                  - { name: "availabilityStatus", label: "Availability Status", widget: "string" }
                  - { name: "freelanceAvailability", label: "Freelance Availability", widget: "boolean" }
          - name: "navigation"
            label: "Navigation"
            widget: "object"
            fields:
              - { name: "sticky", label: "Sticky Navigation", widget: "boolean" }
              - { name: "floatingSideNavigation", label: "Floating Side Navigation", widget: "boolean" }
              - { name: "activeSectionHighlighting", label: "Active Section Highlighting", widget: "boolean" }
              - { name: "smoothScrolling", label: "Smooth Scrolling", widget: "boolean" }
              - { name: "mobileMenu", label: "Mobile Menu", widget: "boolean" }
              - name: "items"
                label: "Menu Items"
                widget: "list"
                fields:
                  - { name: "id", label: "ID", widget: "string" }
                  - { name: "label", label: "Label", widget: "string" }
                  - { name: "href", label: "Href", widget: "string" }
                  - { name: "sectionKey", label: "Section Key", widget: "string" }
                  - { name: "visible", label: "Visible", widget: "boolean" }
                  - { name: "order", label: "Order", widget: "number" }
          - name: "hero"
            label: "Hero"
            widget: "object"
            fields:
              - { name: "headline", label: "Headline", widget: "string" }
              - { name: "subHeadline", label: "Subheadline", widget: "string" }
              - { name: "introductionText", label: "Introduction Text", widget: "text" }
              - { name: "typingAnimationTextList", label: "Typing Text List", widget: "list", field: { name: "item", label: "Item", widget: "string" } }
              - { name: "profileImage", label: "Profile Image", widget: "image", required: false }
          - name: "about"
            label: "About"
            widget: "object"
            fields:
              - { name: "aboutTitle", label: "About Title", widget: "string" }
              - { name: "shortSummary", label: "Short Summary", widget: "text" }
              - { name: "fullDescription", label: "Full Description", widget: "markdown" }
          - name: "skills"
            label: "Skills"
            widget: "object"
            fields:
              - name: "categories"
                label: "Categories"
                widget: "list"
                fields:
                  - { name: "id", label: "ID", widget: "string" }
                  - { name: "name", label: "Name", widget: "string" }
          - name: "experience"
            label: "Experience"
            widget: "object"
            fields:
              - name: "items"
                label: "Items"
                widget: "list"
                fields:
                  - { name: "id", label: "ID", widget: "string" }
                  - { name: "position", label: "Position", widget: "string" }
          - name: "education"
            label: "Education"
            widget: "object"
            fields:
              - name: "items"
                label: "Items"
                widget: "list"
                fields:
                  - { name: "id", label: "ID", widget: "string" }
                  - { name: "degreeName", label: "Degree Name", widget: "string" }
          - name: "projects"
            label: "Projects"
            widget: "object"
            fields:
              - name: "items"
                label: "Items"
                widget: "list"
                fields:
                  - { name: "id", label: "ID", widget: "string" }
                  - { name: "projectName", label: "Project Name", widget: "string" }
          - name: "testimonials"
            label: "Testimonials"
            widget: "object"
            fields:
              - name: "items"
                label: "Items"
                widget: "list"
                fields:
                  - { name: "id", label: "ID", widget: "string" }
                  - { name: "name", label: "Name", widget: "string" }
          - name: "contact"
            label: "Contact"
            widget: "object"
            fields:
              - { name: "email", label: "Email", widget: "string", required: false }
          - name: "footer"
            label: "Footer"
            widget: "object"
            fields:
              - { name: "copyrightText", label: "Copyright Text", widget: "string", required: false }
